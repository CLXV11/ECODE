name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build CodeXCroc APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 🔑 Make Gradlew Executable
        run: chmod +x gradlew

      - name: 🧪 Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 🔨 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 📦 Prepare APK Artifacts
        id: prepare_apk
        run: |
          mkdir -p output_apks
          if [ -d "app/build/outputs/apk/debug" ]; then
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apks/CodeXCroc-debug.apk \;
          fi
          if [ -d "app/build/outputs/apk/release" ]; then
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} output_apks/CodeXCroc-release.apk \;
          fi
          echo "Listing output APKs:"
          ls -la output_apks/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeXCroc-APK
          path: output_apks/*.apk
          retention-days: 14

      - name: 🏷️ Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

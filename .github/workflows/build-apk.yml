name: Android CI - Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      run_tests:
        description: 'Execute Unit & Robolectric Tests before build'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Publish GitHub Release (when triggered manually)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ECODE APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Configure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding existing debug.keystore from base64..."
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ./debug.keystore
          else
            echo "Generating fresh standard Android debug keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ./debug.keystore
          fi

      - name: Run Unit & JVM Tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true' }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew :app:assembleDebug --no-daemon -Djava.awt.headless=true

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew :app:assembleRelease --no-daemon -Djava.awt.headless=true

      - name: Collect & Stage APK Artifacts
        id: stage_artifacts
        run: |
          mkdir -p dist
          
          # Collect debug APK
          if [ -d "app/build/outputs/apk/debug" ]; then
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/ECODE-debug.apk \;
          fi
          
          # Collect release APK if generated
          if [ -d "app/build/outputs/apk/release" ]; then
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/ECODE-release.apk \;
          fi
          
          # Generate SHA-256 checksums
          cd dist
          if ls *.apk 1> /dev/null 2>&1; then
            sha256sum *.apk > SHA256SUMS.txt
            echo "Staged Artifacts:"
            ls -lh
            cat SHA256SUMS.txt
          else
            echo "Error: No APK files found in output directories!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ECODE-Android-APK
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
